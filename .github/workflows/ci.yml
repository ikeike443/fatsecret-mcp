name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Turbopack persists its compiler artifacts in .next/cache
      # (experimental.turbopackFileSystemCacheForBuild in next.config.ts), so
      # restoring that directory is what makes the CI build warm instead of cold.
      # Keyed on the lockfile plus the sources that invalidate compilation; the
      # restore-key falls back to the nearest earlier cache for the same lockfile,
      # so a one-line source change still reuses most of the previous build's
      # work. There is deliberately no lockfile-independent fallback: a cache
      # built against a different Next.js version is exactly the case where the
      # build should start cold.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: >-
            ${{ runner.os }}-node22-nextcache-${{ hashFiles('package-lock.json') }}-${{
            hashFiles('app/**/*.ts', 'app/**/*.tsx', 'lib/**/*.ts', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-nextcache-${{ hashFiles('package-lock.json') }}-

      # Step names are deliberately stable and match trend.trackedSteps in
      # build-perf.config.json — build-perf-report.ts looks steps up by name when
      # comparing this run against the recent history of runs on main.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Dead code detection (knip)
        run: npm run knip

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit + integration tests
        run: npm run test

      # Wraps `next build` with timing, Next.js build-trace phase breakdown,
      # output-size measurement and the budgets in build-perf.config.json.
      # --warn-only here on purpose: the budgets are enforced after the E2E tests
      # below, so a slow build cannot stop a correctness check from running.
      - name: Build
        run: npm run build:measure -- --warn-only

      # Real HTTP server against the production build; no external secrets required.
      - name: E2E tests
        run: npm run test:e2e

      # Fails the job if the build blew a budget the step above only warned about.
      - name: Build performance budget
        run: npm run build:budget-check

      - name: Upload build metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build-metrics/
          # .build-metrics is a dot-directory, and upload-artifact skips hidden
          # paths by default — without this the artifact comes out empty.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  # Turns CI step timings into a tracked trend instead of an anecdote: compares
  # this run's steps against the p50/p90 of recent successful runs on main and
  # warns when one got substantially slower. Read-only, warn-only — it never
  # fails the build on its own.
  build-perf-trend:
    needs: test
    # Runs even when `test` failed: a red run is exactly when its step timings are
    # worth seeing (a budget breach, a build that suddenly got slow).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The script already downgrades every GitHub API failure to a warning;
      # continue-on-error is the belt-and-braces version of the same promise, so
      # an unexpected crash in a read-only report cannot turn the run red either.
      - name: CI timing trend report
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:perf-report

      - name: Upload timing trend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-trend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build-metrics/ci-timing-trend.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
